[package]
name = "rustsql"
version = "0.0.1"
edition = "2021"
authors = ["Huy <dev@amsoftware.com.vn>"]
description = "RustSQL (ruql) - Next-Generation PostgreSQL and Amazon Redshift CLI"
license = "MIT"
repository = "https://github.com/AMSComm/RustSQL"

[lib]
name = "rustsql"
path = "src/lib.rs"

[[bin]]
name = "ruql"
path = "src/main.rs"

[dependencies]
# CLI & Args
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime & DB
tokio = { version = "1.43", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
native-tls = { version = "0.2", features = ["vendored"] }
postgres-native-tls = "0.5"

# REPL, Terminal & UI
rustyline = { version = "19.0", features = ["derive", "with-file-history"] }
crossterm = "0.28"
comfy-table = "7.1"
colored = "3.0"
rpassword = "7.3"
dirs = "6.0"

# Data formatting & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Auto-update & packaging
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
self-replace = "1.5"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
