name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v0.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal M1/M2/M3 & Intel)
            id: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            use-cross: false
          - name: Linux (x86_64)
            id: linux-x86
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            use-cross: false
          - name: Linux (ARM64)
            id: linux-arm64
            os: ubuntu-latest
            targets: aarch64-unknown-linux-gnu
            use-cross: true
          - name: Windows (x86_64)
            id: windows-x86
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            use-cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Cross for ARM64 Linux
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        shell: bash
        run: |
          IFS=',' read -ra TARGETS <<< "${{ matrix.targets }}"
          for target in "${TARGETS[@]}"; do
            echo "Building for target: $target"
            if [ "${{ matrix.use-cross }}" = "true" ]; then
              cross build --release --target "$target"
            else
              cargo build --release --target "$target"
            fi
          done

      - name: Package release artifact
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          IFS=',' read -ra TARGETS <<< "${{ matrix.targets }}"
          for target in "${TARGETS[@]}"; do
            echo "Packaging target: $target"
            python3 .github/workflows/package.py "$target" "$TAG_NAME"
          done

      - name: Upload artifact to job
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.id }}
          path: artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: artifacts
          merge-multiple: true

      - name: Aggregate Checksums
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt || true
          rm -f *.sha256
          echo "Aggregated checksums:"
          cat checksums.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          python3 -c "
          import re, os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          if not tag or tag == 'main':
              tag = '${{ github.event.inputs.tag }}'
          if not tag:
              tag = 'v0.0.1'
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              tag_escaped = re.escape(tag.lstrip('v'))
              pattern = rf'(## \[[v]?{tag_escaped}\].*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
          except Exception as e:
              print(f'Error reading CHANGELOG.md: {e}')
          if not notes:
              notes = f'## RustSQL {tag}\n\nNext-generation PostgreSQL and Amazon Redshift CLI.'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          print('Extracted notes:')
          print(notes)
          "

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RustSQL ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Notes Synced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -f RELEASE_NOTES.md ]; then
            for i in {1..5}; do
              if gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md; then
                echo "Successfully updated $TAG release notes on GitHub!"
                break
              fi
              echo "Attempt $i failed. Retrying in 3s..."
              sleep 3
            done
          fi
