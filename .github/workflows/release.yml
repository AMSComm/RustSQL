name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use-cross: false
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Cross for cross-compilation
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare packaging (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          BIN_PATH="target/${{ matrix.target }}/release/ruql"
          strip "$BIN_PATH" || true
          mkdir -p package
          cp "$BIN_PATH" package/ruql
          cp README.md package/ || true
          cp LICENSE package/ || true
          ARCHIVE_NAME="ruql-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C package .
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "SHA_PATH=$ARCHIVE_NAME.sha256" >> $GITHUB_ENV

      - name: Prepare packaging (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          BIN_PATH="target/${{ matrix.target }}/release/ruql.exe"
          mkdir -p package
          cp "$BIN_PATH" package/ruql.exe
          cp README.md package/ || true
          cp LICENSE package/ || true
          ARCHIVE_NAME="ruql-${TAG_NAME}-${{ matrix.target }}.zip"
          7z a "$ARCHIVE_NAME" ./package/*
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "SHA_PATH=$ARCHIVE_NAME.sha256" >> $GITHUB_ENV

      - name: Upload artifact to job
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ruql-*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate Checksums
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt || true
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RustSQL ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
